<script>
(function () {
  var KEY = 'zk-map-pass';
  try { var t = localStorage.getItem('zk-map-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (x) {}
  var D = JSON.parse(document.getElementById('d').textContent);
  var f = document.getElementById('f'), p = document.getElementById('p'), b = document.getElementById('b'), e = document.getElementById('e');
  function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function decrypt(pass) {
    var c = crypto.subtle;
    return c.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (k) { return c.deriveKey({ name: 'PBKDF2', salt: bytes(D.s), iterations: D.n, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
      .then(function (k) { return c.decrypt({ name: 'AES-GCM', iv: bytes(D.i) }, k, bytes(D.c)); })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function show(html) {
    document.open(); document.write(html); document.close();
    var id = decodeURIComponent(location.hash.slice(1)), el = id && document.getElementById(id);
    if (el) el.scrollIntoView();
  }
  function ask(msg) { f.hidden = false; e.textContent = msg || ''; p.focus(); }
  if (!window.crypto || !crypto.subtle) { ask('Браузер не может открыть страницу: нужен адрес https://'); b.disabled = true; return; }
  f.addEventListener('submit', function (ev) {
    ev.preventDefault(); b.disabled = true; e.textContent = '';
    var pass = p.value;
    decrypt(pass).then(function (html) { try { localStorage.setItem(KEY, pass); } catch (x) {} show(html); },
      function () { b.disabled = false; p.select(); e.textContent = 'Пароль не подошёл'; });
  });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (x) {}
  if (saved) decrypt(saved).then(show, function () { try { localStorage.removeItem(KEY); } catch (x) {} ask(); });
  else ask();
})();
</script>
